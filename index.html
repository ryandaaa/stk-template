<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 48px auto;
        padding: 0 20px;
        line-height: 1.5;
      }
      form {
        display: flex;
        gap: 8px;
        margin: 24px 0;
      }
      input {
        flex: 1;
        padding: 10px;
      }
      button {
        padding: 10px 14px;
        cursor: pointer;
      }
      article {
        border-top: 1px solid #ddd;
        padding: 14px 0;
      }
      .muted {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Search Demo</h1>
    <p class="muted">Template HTML statis + Python API di Vercel.</p>

    <form id="search-form">
      <input id="query" type="search" placeholder="Masukkan query" required />
      <button type="submit">Search</button>
    </form>

    <div id="status" class="muted"></div>
    <section id="results"></section>

    <script>
      const form = document.querySelector("#search-form");
      const queryInput = document.querySelector("#query");
      const statusEl = document.querySelector("#status");
      const resultsEl = document.querySelector("#results");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        statusEl.textContent = "Loading...";
        resultsEl.innerHTML = "";

        try {
          const response = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: queryInput.value }),
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Request gagal");

          statusEl.textContent = `${data.total_results} hasil ditemukan`;
          resultsEl.innerHTML = data.results
            .map(
              (item) => `
                <article>
                  <strong>${escapeHtml(item.title)}</strong>
                  <p>${escapeHtml(item.snippet)}</p>
                </article>
              `
            )
            .join("");
        } catch (error) {
          statusEl.textContent = error.message;
        }
      });

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }
    </script>
  </body>
</html>
